[package]
name = "flux-core"
version = "1.2.0"
edition = "2021"
authors = ["FLUX Contributors"]
description = "Core compression engine for FLUX"
license = "GPL-3.0-only OR Commercial"

[lib]
name = "flux_core_v1"
crate-type = ["rlib", "cdylib"]

[dependencies]
sysinfo = "0.30"
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
crc32fast = "1.3"
crossbeam = "0.8"
rayon = "1.8"
wide = "0.7"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
filetime = "0.2"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
tempfile = "3.8"
